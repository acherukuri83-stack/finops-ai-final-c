name: verify
on: [pull_request, push]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: finops, POSTGRES_PASSWORD: finops, POSTGRES_DB: finops }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U finops" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: portal/package-lock.json }
      - run: cd ai-platform && uv sync
      - run: cd simulator && uv sync
      - run: cd portal && npm ci
      - run: ./scripts/verify.sh

      # --- MCP contract tests against the real enterprise + seeded Postgres ---
      - name: Build enterprise jar
        run: cd enterprise && mvn -q -DskipTests package
      - name: Start enterprise
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/finops
          SPRING_DATASOURCE_USERNAME: finops
          SPRING_DATASOURCE_PASSWORD: finops
          SPRING_FLYWAY_ENABLED: "false"   # schema already applied by scripts/migrate.sh in verify.sh
        run: |
          java -jar enterprise/target/enterprise-0.1.0.jar > enterprise.log 2>&1 &
          for _ in $(seq 1 60); do curl -sf localhost:8080/health && break; sleep 2; done
          curl -sf localhost:8080/health
      - name: Seed all scenarios
        env:
          DATABASE_URL: postgresql+psycopg://finops:finops@localhost:5432/finops
        run: cd simulator && uv run python -m simulator.cli seed --scenario all
      - name: MCP contract tests
        env:
          ENTERPRISE_BASE_URL: http://localhost:8080
        run: cd ai-platform && uv run pytest -m contract -q
      - name: Enterprise log (on failure)
        if: failure()
        run: tail -n 200 enterprise.log || true
