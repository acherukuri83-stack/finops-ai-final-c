name: eval
# Costs real money (Claude API calls). Runs when agent-behaviour inputs change, or on
# manual dispatch. Needs the repo secret ANTHROPIC_API_KEY — without it `evals.cli`
# exits with a clear message and the job fails (it never silently passes).
on:
  workflow_dispatch:
    inputs:
      n:
        description: "runs per scenario"
        default: "3"
      scenario:
        description: "single scenario id (blank = whole suite)"
        default: ""
  pull_request:
    paths:
      - "ai-platform/agent_core/prompts/**"
      - "ai-platform/agent_core/policy/**"
      - "ai-platform/agent_core/loop.py"
      - "ai-platform/agent_core/outcomes.py"
      - "ai-platform/knowledge/**"
      - "ai-platform/evals/**"
      - "simulator/**"

# A new push to the same PR/branch cancels the running eval — one real-model run
# (~$2, ~35 min) can be in flight at a time, not a stack of superseded ones.
concurrency:
  group: eval-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: finops, POSTGRES_PASSWORD: finops, POSTGRES_DB: finops }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U finops" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://finops:finops@localhost:5432/finops
      ENTERPRISE_BASE_URL: http://localhost:8080
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - run: cd ai-platform && uv sync
      - run: cd simulator && uv sync

      - name: Migrate schema
        run: ./scripts/migrate.sh
      - name: Build & start enterprise
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/finops
          SPRING_DATASOURCE_USERNAME: finops
          SPRING_DATASOURCE_PASSWORD: finops
          SPRING_FLYWAY_ENABLED: "false"
        run: |
          cd enterprise && mvn -q -DskipTests package && cd ..
          java -jar enterprise/target/enterprise-0.1.0.jar > enterprise.log 2>&1 &
          for _ in $(seq 1 60); do curl -sf localhost:8080/health && break; sleep 2; done
          curl -sf localhost:8080/health

      - name: Scenario suite (real model, n=3)
        # The harness seeds + ingests per scenario (Sc. 2's flip needs the fixture in one
        # run and absent in the other). Sc. 12 is excluded by default — it needs a
        # process-global FAULT_INJECT on the enterprise; tests/test_loop.py covers it.
        run: |
          cd ai-platform && uv run python -m evals.cli \
            --n "${{ github.event.inputs.n || '3' }}" \
            ${{ github.event.inputs.scenario && format('--scenario {0}', github.event.inputs.scenario) || '' }}

      - name: Upload scorecard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SCORECARD
          path: ai-platform/evals/SCORECARD.md
          if-no-files-found: warn

      - name: Enterprise log (on failure)
        if: failure()
        run: tail -n 200 enterprise.log || true
