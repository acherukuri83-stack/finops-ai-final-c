# Phase F — a client across two domains (wire-free). HEDGE_FUND_101 has ONE settlement
# fail and ONE open stock loan on the same day:
#   - T100245 FAILED COUNTERPARTY_SSI_MISMATCH vs CP-017 — the CP-017 instruction/
#     affirmation carries an older DTC than our current SSI (as Sc. 1);
#   - LN-5001, 30000 NVDA out to CP-020, whose shares ACC-88213 needs back to make a
#     delivery, with the recall notice window still open.
# The Supervisor must discover BOTH (failed trade + open loan), decompose into a
# `settlement` and a `stockloan` sub-task, dispatch under delegation spans, and correlate
# into ONE client answer: `resubmit_settlement` for the trade, `initiate_recall` for the
# loan, `update_ssi` rejected. Facts only — the split is planted, the reason is not.
id: 30
name: mixed_domain_client
baseline: default
plant:
  accounts.ssi:
    - {account: ACC-88213, version: 1, dtc: "9012", valid_from: 2024-01-15, valid_to: 2025-11-02, by: ops.klee}
    - {account: ACC-88213, version: 2, dtc: "5678", valid_from: 2025-11-02, valid_to: 2026-08-28, by: ops.mchen}
    - {account: ACC-88213, version: 3, dtc: "1234", valid_from: 2026-08-28, by: ops.jsmith}
  counterparties.ssi:
    - {cpty: CP-017, dtc: "5678", valid_to: 2027-01-01}
  trades:
    - {id: T100245, client: HEDGE_FUND_101, account: ACC-88213, security: AAPL, qty: 25000, side: BUY,
       price: 227.15, trade_date: 2026-09-03, settle_date: 2026-09-04, status: FAILED,
       failure_code: COUNTERPARTY_SSI_MISMATCH, cpty: CP-017}
  settlement_attempts:
