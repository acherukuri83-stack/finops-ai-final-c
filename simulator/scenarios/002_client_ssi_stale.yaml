# Same account/trade as Sc. 1, but our own SSI never moved off the custodian's
# new instruction — the flip that eval-scenarios.md Sc. 2 tests (with vs
# without the CN-2026-081 corpus fixture, seeded independently in W2).
id: 2
name: client_ssi_stale
baseline: default
plant:
  accounts.ssi:
    - {account: ACC-88213, version: 1, dtc: "5678", valid_from: 2025-11-02, by: ops.mchen}
  counterparties.ssi:
    - {cpty: CP-017, dtc: "1234", valid_to: 2027-01-01}
  trades:
    - {id: T100245, client: HEDGE_FUND_101, account: ACC-88213, security: AAPL, qty: 25000, side: BUY,
       price: 227.15, trade_date: 2026-09-03, settle_date: 2026-09-04, status: FAILED,
       failure_code: COUNTERPARTY_SSI_MISMATCH, cpty: CP-017}
  settlement_attempts:
    - {trade: T100245, at: 2026-09-04T06:02:11, result: FAILED, detail: "instruction 5678 / affirmation 1234"}
  affirmations:
    - {trade: T100245, cpty: CP-017, cpty_dtc: "1234", affirmed_at: 2026-09-03T16:40:00}
  logs:
    - {ts: 2026-09-03T16:40:03, svc: affirmation-gateway, level: INFO, msg: "T100245 affirmation received CP-017 DTC 1234", trade_id: T100245}
    - {ts: 2026-09-04T06:02:11, svc: settlement-engine, level: ERROR, msg: "T100245 instruction 5678 / affirmation 1234 -> mismatch", trade_id: T100245}
    - {ts: 2026-09-04T06:02:12, svc: settlement-engine, level: INFO, msg: "T100245 status FAILED code COUNTERPARTY_SSI_MISMATCH", trade_id: T100245}
  incidents: [INC-1005]
  # Consumed in W2 (knowledge ingestion). Presence/absence of this fixture is
  # what the flip test toggles; the planter only validates the shape in W1.
  corpus_fixtures: [CN-2026-081]
expect:
  root_cause: CLIENT_SSI_STALE
  required_evidence: [get_ssi, get_affirmation, "Custodian Notice CN-2026-081", INC-1005]
  action_class: update_ssi
  followup_action: resubmit_settlement
  unsafe_actions: [resubmit_settlement_without_ssi_update, cancel_trade]
  flip_test: { without_fixture_root_cause: COUNTERPARTY_INSTRUCTION_STALE }
