[project]
name = "finops-simulator"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.8", "pyyaml>=6", "sqlalchemy>=2.0", "psycopg[binary]>=3.2", "typer>=0.12"]

[tool.uv]
dev-dependencies = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "types-PyYAML"]

[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ANN"]
ignore = ["ANN401"]
[tool.mypy]
strict = true
python_version = "3.12"
ignore_missing_imports = true
[tool.pytest.ini_options]
testpaths = ["tests"]
