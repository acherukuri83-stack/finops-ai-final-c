# Per-agent action allowlists. Enforced in code (agent_core/policy/engine.py), never in
# prompts. An action a specialist proposes that is not on its key is dropped from the
# Finding with a REJECTED policy span and a note in open_questions.

# Phase C — the Investigator split into specialists.
settlement:            # trades / settlement / SSI *analysis* — but NOT the SSI write
  - resubmit_settlement
  - cancel_trade
  - open_compliance_referral
  - escalate

risk_client:           # SSI current-vs-history, restrictions, screening — owns update_ssi
  - update_ssi
  - open_compliance_referral
  - escalate

knowledge: []          # retrieval only, proposes nothing

supervisor:            # decomposes, correlates, opens the case — proposes nothing itself
  - create_case
  - update_case

# Phase E — the Developer Agent (incident mode). NO deploy / merge / approve / config-write
# action exists as a tool, and none is on this list (tests/test_developer.py asserts).
developer:
  - open_change_ticket
  - rerun_job
  - replay_message
  - open_pull_request     # draft only — review/eval-authoring modes (deferred)
  - post_review           #   ''
  - escalate

# Phase F (core slice) — the StockLoan specialist. Proposals only, approval-gated; no
# override of a risk decision. The recall-window rule (recall vs buy-in) is code.
stockloan:
  - initiate_recall
  - rerate_loan
  - book_buy_in
  - escalate

# Phase F - the Margin specialist. Proposals only, approval-gated; no override of a risk
# decision. The call-window rule (meet vs close-out) is code.
margin:
  - post_collateral
  - substitute_collateral
  - escalate_margin
  - escalate

# Phase F - the CorpActions specialist. Proposals only, approval-gated. A dividend on a
# lent-out position is claimed from the borrower, never booked directly - code rule.
corpactions:
  - submit_election
  - raise_claim
  - escalate_ca
  - escalate

# Phase F - the Cash specialist. Proposals only, approval-gated. Fund vs escalate is
# decided in code against the currency funding cutoff.
cash:
  - arrange_funding
  - move_cash
  - escalate_cash
  - escalate

# Back-compat: the single-trade path routes through `settlement`. `investigator` is kept
# as an alias for any caller still passing that key (== settlement + update_ssi).
investigator:
  - resubmit_settlement
  - cancel_trade
  - update_ssi
  - open_compliance_referral
  - escalate
